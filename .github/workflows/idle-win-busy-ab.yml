name: idle-win-busy-ab

# Scratch: why the real cap-gpui never idles on a GitHub-hosted Windows VM.
# Per-thread CPU, thread names, leaf samples, samply stacks and a gpui-side
# trace of what requests each frame. Not for main.

on:
  push:
    branches: [ci/idle-win-busy-ab]
  workflow_dispatch:

jobs:
  app:
    name: app (windows)
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Machine info
        shell: pwsh
        continue-on-error: true
        run: |
          Get-CimInstance Win32_VideoController | Format-List Name,DriverVersion,AdapterRAM,CurrentRefreshRate,CurrentHorizontalResolution,CurrentVerticalResolution
          Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors
          Get-Service audiosrv,AudioEndpointBuilder,FrameServer -ErrorAction SilentlyContinue | Format-Table Name,Status,StartType
          Get-PnpDevice -Class AudioEndpoint,Camera,Image,MEDIA -ErrorAction SilentlyContinue | Format-Table Class,FriendlyName,Status
          query session

      - name: Allow long paths in Zed's git dependencies
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: ./.github/actions/setup-rust-cache
        with:
          target: x86_64-pc-windows-msvc
          prefix-key: v1-rust-gpui
          save-cache: false
          workspaces: apps/desktop-gpui -> target

      - name: Run setup
        shell: bash
        run: node scripts/setup.js
        env:
          RUST_TARGET_TRIPLE: x86_64-pc-windows-msvc

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          node scripts/sync-desktop-versions.mjs
          ./scripts/prepare-gpui-dependency.sh
          git -C ../zed-cap apply "$GITHUB_WORKSPACE/scripts/probe/frame-trace.patch"
          cargo +1.95.0 build --manifest-path apps/desktop-gpui/Cargo.toml --locked --target x86_64-pc-windows-msvc --bin cap-gpui

      - name: Fetch samply
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/mstange/samply/releases/download/samply-v0.13.1/samply-x86_64-pc-windows-msvc.zip -OutFile $env:RUNNER_TEMP\samply.zip
          Expand-Archive $env:RUNNER_TEMP\samply.zip -DestinationPath $env:RUNNER_TEMP\samply
          Get-ChildItem -Recurse $env:RUNNER_TEMP\samply | Select-Object FullName

      - name: Profile
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$(cygpath "$GITHUB_WORKSPACE/target/debug"):$PATH"
          app="apps/desktop-gpui/target/x86_64-pc-windows-msvc/debug/cap-gpui.exe"
          out="$RUNNER_TEMP/out"
          samply="$(find "$RUNNER_TEMP/samply" -name samply.exe | head -1)"
          python scripts/probe/thread_profile.py --label main-trace --out "$out" ${samply:+--samply "$samply"} \
            --env CAP_PERF_SKIP_ONBOARDING=1 --env CAP_FRAME_TRACE=1 --env RUST_LOG=info "$app"
          python scripts/probe/thread_profile.py --label main-clean --out "$out" \
            --env CAP_PERF_SKIP_ONBOARDING=1 "$app"
          python scripts/probe/thread_profile.py --label onboarding-trace --out "$out" \
            --env CAP_FRAME_TRACE=1 --env RUST_LOG=info "$app"
          for f in "$out"/*-app.log; do
            echo "=== $f"
            grep -v FRAMETRACE "$f" | tail -60
            echo "--- last FRAMETRACE blocks"
            grep FRAMETRACE "$f" | tail -50
          done
          true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-busy
          path: ${{ runner.temp }}/out
