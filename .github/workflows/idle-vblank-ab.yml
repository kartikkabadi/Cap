name: idle-vblank-ab

# Scratch: main-thread wakeups of an idle visible gpui window on Windows and
# X11, base patches vs a head branch's patches, same runner. Not for main.

on:
  push:
    branches: [ci/idle-vblank-ab]
  workflow_dispatch:
    inputs:
      head_ref:
        description: "Branch whose apps/desktop-gpui/patches are the head variant ('' = base only)"
        default: ""
      rounds:
        default: "3"
      seconds:
        default: "60"

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Blacksmith Windows runs jobs in session 0 with no desktop, so
          # Windows uses GitHub-hosted (interactive console session).
          - name: windows
            runner: windows-2022
          - name: linux-x11
            runner: blacksmith-8vcpu-ubuntu-2404
    name: probe (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      ROUNDS: ${{ inputs.rounds || '3' }}
      SECONDS_PER_RUN: ${{ inputs.seconds || '60' }}
    steps:
      - uses: actions/checkout@v4

      # A push runs against the head named in scripts/probe/head-ref.txt.
      - name: Pick head
        shell: bash
        run: |
          head="${{ inputs.head_ref }}"
          if [[ "${{ github.event_name }}" == "push" && -f scripts/probe/head-ref.txt ]]; then
            head="$(tr -d '[:space:]' < scripts/probe/head-ref.txt)"
          fi
          echo "HEAD_REF=$head" >> "$GITHUB_ENV"

      - name: Install Linux desktop dependencies
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/install-desktop-deps

      - name: Install Linux display and software GPU
        if: ${{ runner.os == 'Linux' }}
        run: sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 libegl1 libegl-mesa0 libgl1-mesa-dri

      - name: Allow long paths in Zed's git dependencies
        if: ${{ runner.os == 'Windows' }}
        run: git config --global core.longpaths true

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Python deps
        shell: bash
        run: python3 -m pip install --quiet pillow || python -m pip install --quiet pillow

      - name: Build base
        shell: bash
        run: |
          set -euxo pipefail
          ./scripts/prepare-gpui-dependency.sh
          mkdir -p "$RUNNER_TEMP/bin"
          cp scripts/probe/idle_probe.rs ../zed-cap/crates/gpui/examples/idle_probe.rs
          start=$(date +%s)
          (cd ../zed-cap && cargo +1.95.0 build --release -p gpui --example idle_probe)
          echo "base build seconds: $(( $(date +%s) - start ))"
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          cp "../zed-cap/target/release/examples/idle_probe$ext" "$RUNNER_TEMP/bin/base$ext"

      - name: Build head
        if: ${{ env.HEAD_REF != '' }}
        shell: bash
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth 1 origin "$HEAD_REF"
          mkdir -p "$RUNNER_TEMP/head-patches"
          for p in zed-gpui zed-windows zed-linux zed-idle-frames zed-streaming-image; do
            git show "FETCH_HEAD:apps/desktop-gpui/patches/$p.patch" > "$RUNNER_TEMP/head-patches/$p.patch"
          done
          git -C ../zed-cap reset -q --hard
          git -C ../zed-cap clean -fdq
          for p in zed-gpui zed-windows zed-linux zed-idle-frames zed-streaming-image; do
            git -C ../zed-cap apply --unidiff-zero "$RUNNER_TEMP/head-patches/$p.patch"
          done
          cp scripts/probe/idle_probe.rs ../zed-cap/crates/gpui/examples/idle_probe.rs
          start=$(date +%s)
          (cd ../zed-cap && cargo +1.95.0 build --release -p gpui --example idle_probe)
          echo "head build seconds: $(( $(date +%s) - start ))"
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          cp "../zed-cap/target/release/examples/idle_probe$ext" "$RUNNER_TEMP/bin/head$ext"

      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          ext=""; [[ "$RUNNER_OS" == "Windows" ]] && ext=".exe"
          variants="base=$RUNNER_TEMP/bin/base$ext"
          [[ -n "$HEAD_REF" ]] && variants="$variants head=$RUNNER_TEMP/bin/head$ext"
          py=python3; [[ "$RUNNER_OS" == "Windows" ]] && py=python
          run() {
            $py scripts/probe/idle_wakeups.py --label "${{ matrix.name }} idle" --mode idle \
              --seconds "$SECONDS_PER_RUN" --rounds "$ROUNDS" --json "$RUNNER_TEMP/probe-idle.json" \
              --summary "$RUNNER_TEMP/probe-summary.md" $variants
            $py scripts/probe/idle_wakeups.py --label "${{ matrix.name }} clock" --mode clock \
              --seconds 30 --rounds "$ROUNDS" --json "$RUNNER_TEMP/probe-clock.json" \
              --summary "$RUNNER_TEMP/probe-summary.md" $variants
            status=0
            for v in $variants; do
              $py scripts/probe/repaint_check.py --label "${{ matrix.name }} ${v%%=*}" \
                --summary "$RUNNER_TEMP/probe-summary.md" "${v#*=}" || status=1
            done
            return $status
          }
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            Xvfb :99 -screen 0 1920x1080x24 -noreset &
            export DISPLAY=:99
            sleep 2
          fi
          run || status=$?
          cat "$RUNNER_TEMP/probe-summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit "${status:-0}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.name }}
          path: ${{ runner.temp }}/probe-*
